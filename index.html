<style>
/* Layout: painel tático escuro. Cabeçalho fixo, navegação por abas (rodapé no celular), conteúdo em grade de cartões. */
:root{
  --bg:#070e1b;          /* azul-marinho profundo */
  --panel:#0d1a2e;       /* painel */
  --panel2:#13233b;      /* painel elevado */
  --lead:#252e38;        /* cinza chumbo */
  --line:#23344d;
  --fg:#e6edf6;
  --muted:#8fa0b5;
  --ok:#10b981;          /* verde-esmeralda: conclusão */
  --gold:#f2c14e;        /* dourado: conquistas */
  --bad:#f0616d;
  --f-display:'Chakra Petch','Inter',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{
  background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;
  margin:0;padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));

  background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.font-display{font-family:var(--f-display)}
.font-mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
input,select,textarea,button{font-family:inherit}
input[type=checkbox]{accent-color:var(--ok)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#2a3d58;border-radius:8px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px}
.field{background:#0a1526;border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:.5rem .65rem;width:100%;min-width:0}

select.field option{background:#0a1526;color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border-radius:9px;padding:.55rem .9rem;font-weight:600;font-size:.875rem;border:1px solid var(--line);background:var(--lead);color:var(--fg);cursor:pointer;transition:transform .12s,background .15s,border-color .15s}

.btn-ok{background:var(--ok);border-color:var(--ok);color:#03160f}.btn-ok:hover{background:#34d399;border-color:#34d399}

.btn-sm{padding:.35rem .6rem;font-size:.8rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.2rem .6rem;font-size:.75rem;font-weight:600;border:1px solid var(--line);background:#0a1526;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip.on{background:rgba(242,193,78,.14);border-color:rgba(242,193,78,.55);color:var(--gold)}
.tag{display:inline-flex;align-items:center;border-radius:6px;padding:.12rem .45rem;font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.tag-o{background:rgba(242,193,78,.16);color:var(--gold);border:1px solid rgba(242,193,78,.4)}
.tag-m{background:rgba(125,160,210,.14);color:#9db8e0;border:1px solid rgba(125,160,210,.35)}
.tag-p{background:rgba(143,160,181,.1);color:var(--muted);border:1px solid rgba(143,160,181,.3)}
.bar{height:8px;border-radius:99px;background:#0a1526;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.label{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
/* checkbox animado */
.chk{width:26px;height:26px;border-radius:8px;border:2px solid #3a4c66;background:#0a1526;display:grid;place-items:center;flex:none;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .3s}
.chk.on{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 4px rgba(16,185,129,.18)}
.chk svg{opacity:0;transform:scale(.3);color:#03160f}
.chk.on svg{opacity:1;animation:pop .42s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg)}60%{transform:scale(1.35) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .35s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:rise .35s ease both}
/* flashcard 3D */

.flip{position:relative;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1)}

.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:1.25rem;display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg)}
.dragover{outline:2px dashed var(--gold);outline-offset:2px}
.glow-gold{box-shadow:0 0 0 1px rgba(242,193,78,.4),0 0 30px rgba(242,193,78,.12)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
#loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);font-family:var(--f-display);letter-spacing:.1em}

/* ============ som e confete ============ */
let SOUND_ON=true, AC=null;
function tone(freqs,dur=.12,vol=.05){
  if(!SOUND_ON) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    freqs.forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
      const t=AC.currentTime+i*dur*.8;
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur+.12);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.15);
    });
  }catch(e){}
}

function burst(x,y,n=16){
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  const cols=['#10b981','#34d399','#f2c14e','#e8aa1c','#7dd3fc'];
  for(let i=0;i<n;i++){
    const e=document.createElement('i');
    Object.assign(e.style,{position:'fixed',left:x+'px',top:y+'px',width:'7px',height:'7px',borderRadius:Math.random()<.5?'50%':'2px',background:pick(cols),zIndex:100,pointerEvents:'none'});
    document.body.appendChild(e);
    const a=Math.random()*Math.PI*2,d=34+Math.random()*60;
    const an=e.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+26}px) rotate(${Math.random()*540}deg) scale(.3)`,opacity:0}],{duration:650+Math.random()*350,easing:'cubic-bezier(.2,.8,.3,1)'});
    an.onfinish=()=>e.remove();
  }
}
const burstEl=(el,n)=>{if(!el)return;const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,n);};

const PB={5:20,10:10,15:20,20:5,25:4,30:10,40:5,50:2,60:5,75:4};
const shortcut=(p,N)=>p===50?`50% é a metade: ${fmt(N/2)}.`:p===25?`25% é um quarto: ${fmt(N/4)}.`:p%10===0?`10% de ${N} = ${fmt(N/10)}. Multiplique por ${p/10}.`:`10% de ${N} = ${fmt(N/10)}; 5% é a metade disso = ${fmt(N/20)}.`;
function genPct(lv){
  const t=ri(1,3);
  if(t===1){
    const p=pick(lv<3?[10,20,25,50]:[5,10,15,20,25,30,40,50,60,75]),N=PB[p]*ri(1,lv<3?5:12);
    const ans=N*p/100;
    return {tipo:'Porcentagem',texto:`Quanto é ${p}% de ${N}?`,ans,hint:{kind:'pct',p,total:N},steps:[`Porcentagem é "por cem": ${p}% = ${p}/100.`,`Conta: ${N} × ${p} ÷ 100 = ${fmt(ans)}.`,`Atalho: ${shortcut(p,N)}`]};
  }
  if(t===2){
    const p=pick(lv<3?[10,20,25,50]:[5,10,15,20,25,30,40]),N=PB[p]*ri(1,lv<3?5:12),up=Math.random()<.5;
    const f=up?1+p/100:1-p/100,ans=Math.round(N*f*100)/100;
    return {tipo:'Porcentagem',texto:`Uma mochila custa R$ ${N}. Com ${up?'aumento':'desconto'} de ${p}%, quanto ela passa a custar? (em R$)`,ans,hint:{kind:'pct',p,total:N},steps:[`${up?'Aumento':'Desconto'} de ${p}% → fator = ${up?'1 +':'1 −'} ${fmt(p/100)} = ${fmt(f)}.`,`${N} × ${fmt(f)} = ${fmt(ans)}.`,`Outro caminho: ${p}% de ${N} = ${fmt(N*p/100)}; ${up?'some':'subtraia'} do valor original.`]};
  }
  const p=pick([10,20,25,40,50,60,75]),M=PB[p]*ri(1,lv<3?4:10)*(lv<2?1:2),N=p*M/100;
  return {tipo:'Porcentagem',texto:`Em uma turma com ${M} alunos, ${N} foram aprovados. Qual a porcentagem de aprovados? (só o número)`,ans:p,hint:{kind:'pct',p,total:M},steps:[`Parte ÷ todo: ${N} ÷ ${M} = ${fmt(N/M)}.`,`Multiplique por 100: ${fmt(N/M)} × 100 = ${p}%.`]};
}
function genR3(lv){
  if(Math.random()<.6){
    const a=pick([2,3,4,5]),p=ri(3,12),m=pick([2,3,4,5,6]),c=a*m,b=a*p,ans=c*p;
    const ctx=pick([['viaturas','litros de combustível'],['cadernos','reais'],['kg de arroz','reais']]);
    const [u1,u2]=ctx;
    const txt=ctx[0]==='viaturas'?`${a} viaturas gastam ${b} litros de combustível em um plantão. Quantos litros gastam ${c} viaturas, no mesmo ritmo?`:`${a} ${u1} custam R$ ${b}. Quanto custam ${c} ${u1}?`;
    return {tipo:'Regra de 3',texto:txt,ans,hint:{kind:'r3',a,b,c,dir:true,u1:ctx[0]==='viaturas'?'viaturas':u1,u2:ctx[0]==='viaturas'?'litros':'R$'},steps:[`Mais ${ctx[0]==='viaturas'?'viaturas':u1} → mais ${ctx[0]==='viaturas'?'litros':'reais'}: grandezas DIRETAS.`,`Multiplique em cruz: ${a} · x = ${b} · ${c}.`,`x = ${b*c} ÷ ${a} = ${ans}.`]};
  }
  const x=pick([2,3,4,6]),d=pick([6,8,9,10,12]),tot=x*d,divs=[];
  for(let y=1;y<=24;y++) if(tot%y===0&&y!==x) divs.push(y);
  const y=pick(divs),ans=tot/y;
  return {tipo:'Regra de 3',texto:`${x} policiais fazem uma ronda em ${d} dias. Em quantos dias ${y} policiais fariam a mesma ronda, no mesmo ritmo?`,ans,hint:{kind:'r3',a:x,b:d,c:y,dir:false,u1:'policiais',u2:'dias'},steps:[`Mais policiais → MENOS dias: grandezas INVERSAS.`,`Na inversa, o produto é constante: ${x} × ${d} = ${tot}.`,`${y} × x = ${tot} → x = ${tot} ÷ ${y} = ${ans} dias.`]};
}
function genStat(lv){
  const t=ri(1,3),n=t===3?ri(3,4)*2-1:(t===2?ri(2,3)*2:ri(4,5));
  if(t===1){
    const nums=Array.from({length:n-1},()=>ri(2,18)),s=nums.reduce((a,b)=>a+b,0);
    let last=((n-s%n)%n)+n*ri(0,1);if(last<1)last+=n;nums.push(last);
    const all=shuffle(nums),tot=all.reduce((a,b)=>a+b,0);
    return {tipo:'Média',texto:`Qual é a média aritmética de ${all.join(', ')}?`,ans:tot/n,hint:{kind:'avg',nums:all},steps:[`Some tudo: ${all.join(' + ')} = ${tot}.`,`Divida pela quantidade (${n}): ${tot} ÷ ${n} = ${fmt(tot/n)}.`]};
  }
  if(t===2){
    const base=Array.from({length:n},()=>ri(2,20));let s=[...base].sort((a,b)=>a-b);
    const h=n/2;if((s[h-1]+s[h])%2){s[h]+=1;}
    const all=shuffle(s),srt=[...all].sort((a,b)=>a-b),ans=(srt[h-1]+srt[h])/2;
    return {tipo:'Mediana',texto:`Qual é a mediana de ${all.join(', ')}?`,ans,hint:{kind:'avg',nums:all,median:true},steps:[`Coloque em ordem: ${srt.join(', ')}.`,`São ${n} números (quantidade par): pegue os dois do meio, ${srt[h-1]} e ${srt[h]}.`,`Média deles: (${srt[h-1]} + ${srt[h]}) ÷ 2 = ${ans}.`]};
  }
  const vals=[...new Set(Array.from({length:n+4},()=>ri(1,15)))].slice(0,n-1);
  while(vals.length<n-1) vals.push(ri(16,30));
  const mode=vals[0],all=shuffle([...vals,mode,mode].slice(0,n+1));
  const cnt={};all.forEach(v=>cnt[v]=(cnt[v]||0)+1);
  const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  if(best[1]&&best[1][1]===best[0][1]){all.push(+best[0][0]);cnt[best[0][0]]++;}
  const m=+Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0];
  return {tipo:'Moda',texto:`Qual é a moda de ${all.join(', ')}?`,ans:m,hint:{kind:'avg',nums:all,mode:m},steps:[`Moda é o valor que MAIS se repete.`,`O número ${m} aparece ${cnt[m]} vezes, mais que os outros.`]};
}
function genSeq(lv){
  const t=ri(1,6);
  let terms=[],ans,labels,rule;
  if(t===1){const a=ri(1,20),r=ri(2,9);terms=[0,1,2,3,4].map(i=>a+i*r);ans=a+5*r;labels=Array(5).fill('+'+r);rule=`Soma ${r} a cada passo.`;}
  else if(t===2){const a=ri(1,4),q=pick([2,3]);terms=[0,1,2,3,4].map(i=>a*q**i);ans=a*q**5;labels=Array(5).fill('×'+q);rule=`Multiplica por ${q} a cada passo.`;}
  else if(t===3){const a=ri(1,10);terms=[a,a+1,a+3,a+6,a+10];ans=a+15;labels=['+1','+2','+3','+4','+5'];rule='A diferença cresce de 1 em 1: +1, +2, +3, +4, +5.';}
  else if(t===4){const x=ri(1,4),y=ri(2,6),s=[x,y];for(let i=2;i<6;i++)s.push(s[i-1]+s[i-2]);terms=s.slice(0,5);ans=s[5];labels=['','soma dos 2 anteriores','soma dos 2 anteriores','soma dos 2 anteriores','soma dos 2 anteriores'].map((l,i)=>i<1?'→':'Σ');rule=`Cada termo é a soma dos dois anteriores: ${terms[3]} + ${terms[4]} = ${ans}.`;}
  else if(t===5){const a=ri(1,10),b=ri(30,50),r=ri(2,5),s=ri(2,6);terms=[a,b,a+r,b+s,a+2*r];ans=b+2*s;labels=['↗','↘','↗','↘','↗'];rule=`Duas sequências misturadas: nas posições ímpares soma ${r} (${a}, ${a+r}, ${a+2*r}...); nas pares soma ${s} (${b}, ${b+s}, ${b+2*s}...).`;}
  else {const k=ri(1,5);terms=[0,1,2,3,4].map(i=>(k+i)**2);ans=(k+5)**2;labels=terms.map((_,i)=>'+'+(2*(k+i)+1));rule=`São quadrados perfeitos: ${k}², ${k+1}², ${k+2}²... O próximo é ${k+5}² = ${ans}.`;}
  return {tipo:'Sequência',texto:`Qual número vem depois? ${terms.join(', ')}, ?`,ans,hint:{kind:'seq',terms,labels},steps:[rule,`Resposta: ${ans}.`]};
}

async function saveFile(name,data,mime){
  try{
    const d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(d){await d.save({filename:name,data});return 'saved';}
  }catch(e){return (e&&e.code)||'error';}
  try{
    const b=new Blob([data],{type:mime||'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);return 'saved';
  }catch(e){return 'error';}
}

function dayEvent(S,iso,wd,recur){
  const bl=(S.schedule[wd]||[]).slice().sort((a,b)=>a.start.localeCompare(b.start));
  if(!bl.length) return null;
  const st=bl[0].start,en=addMin(bl[bl.length-1].start,45);
  const nomes=bl.map(b=>SUBJ[b.subject]?.curto||b.subject);
  const desc=bl.map(b=>`${b.start}-${addMin(b.start,45)} ${SUBJ[b.subject]?.curto}: ${b.foco}`).join('\n')+'\n\nPomodoro: 40 min de foco + 10 min de pausa.';
  const sum=`PMBA • ${DIAS_C[wd]}: ${nomes.join(' + ')}`;
  return {iso,st,en,sum,desc,wd,recur};
}
function buildEvents(S,mode){
  const now=new Date();const evs=[];
  if(mode==='hoje'){
    for(let i=0;i<8;i++){const d=new Date(now);d.setDate(d.getDate()+i);const e=dayEvent(S,isoOf(d),d.getDay(),false);if(e){evs.push(e);break;}}
  }else{
    for(let wd=1;wd<=6;wd++){for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()+i);if(d.getDay()===wd){const e=dayEvent(S,isoOf(d),wd,true);if(e)evs.push(e);break;}}}
  }
  return evs;
}

  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Operacao PMBA//Painel Tatico//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Operação PMBA'];
  evs.forEach(e=>{
    L.push('BEGIN:VEVENT','UID:'+uid()+uid()+'@pmba.painel','DTSTAMP:'+stamp,'DTSTART:'+dtl(e.iso,e.st),'DTEND:'+dtl(e.iso,e.en),'SUMMARY:'+icsEsc(e.sum),'DESCRIPTION:'+icsEsc(e.desc));
    if(e.recur) L.push('RRULE:FREQ=WEEKLY;BYDAY='+BYDAY[e.wd]);
    L.push('BEGIN:VALARM','TRIGGER:-PT'+alarm+'M','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Hora de estudar: '+e.sum),'END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return {text:L.map(fold).join('\r\n')+'\r\n',evs};
}
const gcalLink=e=>e?'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.sum)+'&details='+encodeURIComponent(e.desc)+'&dates='+dtl(e.iso,e.st)+'/'+dtl(e.iso,e.en)+(e.recur?'&recur='+encodeURIComponent('RRULE:FREQ=WEEKLY;BYDAY='+BYDAY[e.wd]):''):'#';

/* ============ MODAL: Agenda (.ics) ============ */
function IcsModal({S,setS,onClose,toast}){
  const [mode,setMode]=useState('hoje');
  const alarm=S.alarm||15;
  const {text,evs}=useMemo(()=>buildICS(S,mode,alarm),[S.schedule,mode,alarm]);
  const [msg,setMsg]=useState('');
  const save=async()=>{
    let r=await saveFile('pmba-lembrete.ics',text,'text/calendar');
    if(r==='rejected_extension'){r=await saveFile('pmba-lembrete.ics.txt',text,'text/plain');if(r==='saved')setMsg('Salvo como .txt. Troque o nome para pmba-lembrete.ics antes de importar na agenda.');else if(r!=='declined')setMsg('Não foi possível salvar aqui. Use "Copiar texto" e cole em um arquivo chamado pmba-lembrete.ics.');return;}
    if(r==='saved')setMsg('Arquivo enviado para download.');else if(r==='declined')setMsg('');else setMsg('Não foi possível salvar aqui. Use "Copiar texto" e cole em um arquivo chamado pmba-lembrete.ics.');
  };
  const copy=async()=>{setMsg((await copyText(text))?'Texto copiado. Cole em um arquivo chamado pmba-lembrete.ics.':'Cópia bloqueada. Selecione o texto abaixo e copie manualmente.');};
  return <Modal title="Lembrete na Agenda (.ics)" onClose={onClose} wide>
    <p className="text-sm" style={{color:'var(--muted)'}}>O arquivo .ics funciona no Google Agenda e no Apple Calendar e já inclui o alarme.</p>
    <div className="flex flex-wrap gap-2 mt-3">
      <button className={'chip '+(mode==='hoje'?'on':'')} onClick={()=>setMode('hoje')}>Só o próximo dia de estudo</button>
      <button className={'chip '+(mode==='semana'?'on':'')} onClick={()=>setMode('semana')}>Semana toda (repete)</button>
    </div>
    <label className="label block mt-4 mb-1" htmlFor="alarm">Alarme antes do início</label>
    <select id="alarm" className="field" value={alarm} onChange={e=>setS(s=>({...s,alarm:+e.target.value}))}>{[5,10,15,30,60].map(m=><option key={m} value={m}>{m} minutos antes</option>)}</select>
    <div className="mt-3 text-sm">{evs.map((e,i)=><div key={i} className="py-1 break-words"><b className="font-display">{e.sum}</b> <span className="font-mono text-xs" style={{color:'var(--muted)'}}>{e.st}–{e.en}</span></div>)}</div>
    <div className="flex flex-wrap gap-2 mt-3">
      <button className="btn btn-gold" onClick={save}><Ic n="Download" size={16}/>Baixar .ics</button>
      <button className="btn" onClick={copy}><Ic n="Copy" size={16}/>Copiar texto</button>

    <textarea id="icstext" readOnly className="field font-mono text-xs" rows={6} value={text} onFocus={e=>e.target.select()}/>
  </Modal>;
}

/* ============ MODAL: Backup ============ */
function BackupModal({S,setS,onClose,toast}){
  const json=useMemo(()=>JSON.stringify({app:'pmba-painel',exportedAt:new Date().toISOString(),data:S},null,2),[S]);
  const [paste,setPaste]=useState('');const [msg,setMsg]=useState('');const fileRef=useRef();
  const doImport=raw=>{
    try{const o=JSON.parse(raw);const d=o&&o.app==='pmba-painel'?o.data:o;if(!d||typeof d!=='object'||!d.schedule||!d.cards)throw 0;setS({...defaults(),...d});toast('Backup importado com sucesso.','ok');onClose();}
    catch(e){setMsg('Arquivo inválido. Use um backup exportado por este painel.');}
  };
  const exp=async()=>{const r=await saveFile('pmba-backup-'+todayISO()+'.json',json,'application/json');setMsg(r==='saved'?'Backup enviado para download.':r==='declined'?'':'Não foi possível salvar aqui. Use "Copiar" e guarde o texto em um arquivo .json.');};
  return <Modal title="Backup do progresso" onClose={onClose} wide>
    <p className="text-sm" style={{color:'var(--muted)'}}>Tudo é salvo automaticamente neste navegador. O backup serve para guardar uma cópia ou levar o progresso para outro aparelho.</p>
    <div className="flex flex-wrap gap-2 mt-3">
      <button className="btn btn-gold" onClick={exp}><Ic n="Download" size={16}/>Exportar JSON</button>
      <button className="btn" onClick={async()=>setMsg((await copyText(json))?'Backup copiado.':'Cópia bloqueada: selecione o texto manualmente.')}><Ic n="Copy" size={16}/>Copiar</button>
    </div>
    <div className="mt-5 pt-4 border-t" style={{borderColor:'var(--line)'}}>
      <h4 className="font-display font-semibold mb-2">Importar backup</h4>
      <input ref={fileRef} id="impfile" type="file" accept=".json,application/json,text/plain" className="hidden" onChange={e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(f);e.target.value='';}}/>
      <button className="btn" onClick={()=>fileRef.current.click()}><Ic n="Upload" size={16}/>Escolher arquivo .json</button>
      <label className="label block mt-3 mb-1" htmlFor="imptxt">Ou cole o conteúdo do backup</label>
      <textarea id="imptxt" className="field font-mono text-xs" rows={4} value={paste} onChange={e=>setPaste(e.target.value)} placeholder='{"app":"pmba-painel", ...}'/>
      <button className="btn btn-ok mt-2" disabled={!paste.trim()} onClick={()=>doImport(paste)}>Importar texto colado</button>
    </div>
    {msg&&<p className="mt-3 text-sm" style={{color:'var(--gold)'}}>{msg}</p>}
  </Modal>;
}

/* ============ POMODORO ============ */
const FOCUS=40*60,BREAK=10*60;
function PomoModal({pomo,setPomo,onClose}){
  const total=pomo.mode==='focus'?FOCUS:BREAK,pct=(1-pomo.left/total)*100;
  const R=88,CI=2*Math.PI*R;
  const toggle=()=>setPomo(p=>p.running?{...p,running:false}:{...p,running:true,endAt:Date.now()+p.left*1000});
  const reset=()=>setPomo(p=>({...p,running:false,mode:'focus',left:FOCUS}));
  const skip=()=>setPomo(p=>{const m=p.mode==='focus'?'break':'focus';return {...p,mode:m,left:m==='focus'?FOCUS:BREAK,running:false};});
  const col=pomo.mode==='focus'?'var(--gold)':'var(--ok)';
  return <Modal title="Sessão de estudo" onClose={onClose}>
    <div className="text-center">
      <div className="label">{pomo.mode==='focus'?'Foco total · 40 min':'Pausa · 10 min'}</div>
      <p className="text-sm mt-1 break-words" style={{color:'var(--muted)'}}>{pomo.label||'Sessão livre'}</p>
      <div className="relative mx-auto my-4" style={{width:200,height:200}}>
        <svg width="200" height="200" viewBox="0 0 200 200" style={{transform:'rotate(-90deg)'}}>
          <circle cx="100" cy="100" r={R} fill="none" stroke="#14253d" strokeWidth="10"/>
          <circle cx="100" cy="100" r={R} fill="none" stroke={col} strokeWidth="10" strokeLinecap="round" strokeDasharray={CI} strokeDashoffset={CI*(1-pct/100)} style={{transition:'stroke-dashoffset .3s linear'}}/>
        </svg>
        <div className="absolute inset-0 grid place-items-center"><div className="font-mono font-bold" style={{fontSize:44,color:col}}>{ft(pomo.left)}</div></div>
      </div>
      <div className="flex justify-center gap-2 flex-wrap">
        <button className={'btn '+(pomo.running?'':'btn-gold')} onClick={toggle}><Ic n={pomo.running?'Pause':'Play'} size={16}/>{pomo.running?'Pausar':pomo.left<total?'Continuar':'Começar'}</button>
        <button className="btn" onClick={reset}><Ic n="RotateCcw" size={16}/>Zerar</button>
        <button className="btn" onClick={skip}>{pomo.mode==='focus'?'Ir p/ pausa':'Ir p/ foco'}</button>
      </div>
      <p className="mt-4 text-sm" style={{color:'var(--muted)'}}>Ciclos de foco concluídos: <b className="font-mono" style={{color:'var(--gold)'}}>{pomo.cycles}</b>. Cada ciclo registra 40 min e dá +15 XP.</p>
      <p className="mt-1 text-xs" style={{color:'var(--muted)'}}>Pode fechar esta janela: o cronômetro continua rodando.</p>
    </div>
  </Modal>;
}

/* ============ ABA 2: CRONOGRAMA ============ */
function Plan({S,setS,today,openPomo}){
  return <div>
    <div className="flex gap-2 mb-4"><button className={'chip '+(S.planView==='week'?'on':'')} onClick={()=>setS(s=>({...s,planView:'week'}))}><Ic n="Clock" size={13}/>Semanal</button><button className={'chip '+(S.planView==='month'?'on':'')} onClick={()=>setS(s=>({...s,planView:'month'}))}><Ic n="CalendarDays" size={13}/>Mensal</button></div>
    {S.planView==='week'?<Week S={S} setS={setS}/>:<Month S={S} setS={setS} today={today}/>}
  </div>;

function Week({S,setS}){
  const drag=useRef(null);const [over,setOver]=useState('');const [noteOpen,setNoteOpen]=useState({});
  const upd=(d,id,patch)=>setS(s=>({...s,schedule:{...s.schedule,[d]:s.schedule[d].map(b=>b.id===id?{...b,...patch}:b)}}));
  const del=(d,id)=>setS(s=>({...s,schedule:{...s.schedule,[d]:s.schedule[d].filter(b=>b.id!==id)}}));
  const add=d=>setS(s=>{const l=s.schedule[d]||[];const st=l.length?addMin(l[l.length-1].start,50):'19:00';return {...s,schedule:{...s.schedule,[d]:[...l,mk('sim','Questões',st)]}};});
  const move=(d,i,dir)=>setS(s=>{const l=[...s.schedule[d]],j=i+dir;if(j<0||j>=l.length)return s;const swap=(a,b)=>({subject:b.subject,foco:b.foco,note:b.note});const A=l[i],B=l[j];l[i]={...A,...swap(A,B)};l[j]={...B,...swap(B,A)};return {...s,schedule:{...s.schedule,[d]:l}};});
  const swapDrop=(d2,id2)=>{const f=drag.current;setOver('');drag.current=null;if(!f||(f.d===d2&&f.id===id2))return;
    setS(s=>{const sch={...s.schedule};const A=sch[f.d].find(b=>b.id===f.id),B=sch[d2].find(b=>b.id===id2);if(!A||!B)return s;
      const pa={subject:A.subject,foco:A.foco,note:A.note},pb={subject:B.subject,foco:B.foco,note:B.note};
      sch[f.d]=sch[f.d].map(b=>b.id===f.id?{...b,...pb}:b);sch[d2]=sch[d2].map(b=>b.id===id2?{...b,...pa}:b);return {...s,schedule:sch};});};
  const sandwich=d=>{const l=S.schedule[d]||[];if(l.length<3)return null;const ok=l.every((b,i)=>b.subject!=='mat'||(i>0&&i<l.length-1));return ok;};
  const restore=()=>setS(s=>({...s,schedule:defaultSchedule()}));
  return <div>
    <div className="card p-4 mb-4 flex flex-wrap items-center justify-between gap-3">
      <div className="min-w-0 flex-1 basis-72"><b className="font-display">Efeito sanduíche</b><p className="text-sm" style={{color:'var(--muted)'}}>Matemática sempre no meio (nunca no primeiro nem no último bloco), com Humanas estudadas por questões. Arraste um bloco sobre outro para trocar as matérias, ou use as setas.</p></div>
      <button className="btn btn-sm" onClick={restore}><Ic n="RotateCcw" size={14}/>Restaurar padrão pré-edital</button>
    </div>
    <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
      {[1,2,3,4,5,6].map(d=>{const l=S.schedule[d]||[],sw=sandwich(d);return <section key={d} className="card p-3 sm:p-4 min-w-0">
        <div className="flex items-center justify-between gap-2 mb-3"><h3 className="font-display font-bold text-lg">{DIAS[d]}</h3>

}

          {tk.length>0&&<div className="flex gap-0.5 mt-1 flex-wrap">{tk.slice(0,4).map(t=><span key={t.id} className="rounded-full" style={{width:6,height:6,background:t.done?'var(--ok)':'var(--gold)'}}/>)}</div>}

    const on=!S.done[t.id];
    if(on){burstEl(el,t.p==='o'?22:14);SFX.ok();}
    setS(s=>{const d={...s.done};if(on)d[t.id]=true;else delete d[t.id];return {...s,done:d};});
  };
  const vis=t=>(!ql||t.txt.toLowerCase().includes(ql)||SUBJ[t.d].curto.toLowerCase().includes(ql))&&(flt==='todos'||(flt==='pend'&&!S.done[t.id])||(flt==='conc'&&S.done[t.id])||(flt==='alta'&&t.p==='o'));

function Cards({S,setS,addXp}){
  const [subj,setSubj]=useState('all');const [curId,setCurId]=useState(null);const [flip,setFlip]=useState(false);const [view,setView]=useState('rev');
  const [fs,setFs]=useState('lp');const [fq,setFq]=useState('');const [fa,setFa]=useState('');
  const inSubj=c=>subj==='all'||c.s===subj;
  const next=useCallback((excl)=>{
    const pool=S.cards.filter(c=>inSubj(c)&&c.id!==excl);const list=pool.length?pool:S.cards.filter(inSubj);
    if(!list.length)return null;const now=Date.now();
    return list.map(c=>{let sc=c.lv==null?70:c.lv===0?100:c.lv===1?55:10;sc+=Math.min((now-(c.last||0))/36e5,24)+Math.random()*25;return [sc,c.id];}).sort((a,b)=>b[0]-a[0])[0][1];
  },[S.cards,subj]);
  const cur=S.cards.find(c=>c.id===curId&&inSubj(c));
  useEffect(()=>{if(!cur)setCurId(next(null));},[cur,subj,S.cards.length]);
  const rate=lv=>{
    if(!cur)return;const id=cur.id;
    setS(s=>({...s,cards:s.cards.map(c=>c.id===id?{...c,lv,last:Date.now(),seen:c.seen+1,errs:c.errs+(lv===0?1:0)}:c)}));
    addXp(lv===2?3:lv===1?2:1);
    if(lv===2){SFX.ok();}else if(lv===0){SFX.bad();}

  };
  const cnt={n:0,0:0,1:0,2:0};S.cards.filter(inSubj).forEach(c=>cnt[c.lv==null?'n':c.lv]++);
  const present=[...new Set(S.cards.map(c=>c.s))];
  const addCard=e=>{e.preventDefault();if(!fq.trim()||!fa.trim())return;setS(s=>({...s,cards:[{id:uid(),s:fs,q:fq.trim(),a:fa.trim(),lv:null,last:0,seen:0,errs:0},...s.cards]}));setFq('');setFa('');SFX.ok();};

      {present.map(s=><button key={s} className={'chip '+(subj===s?'on':'')} onClick={()=>{setSubj(s);setFlip(false);}}><Dot c={SUBJ[s]?.cor}/>{SUBJ[s]?.curto}</button>)}

        <div className="persp"><div style={{height:'clamp(300px,52vh,420px)'}}>
          <div className={'flip '+(flip?'on':'')} onClick={()=>{setFlip(f=>!f);SFX.flip();}} role="button" tabIndex={0} aria-label="Virar card" onKeyDown={e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();setFlip(f=>!f);}}} style={{cursor:'pointer'}}>
            <div className="face" style={{background:'linear-gradient(160deg,#16294a,#0d1a2e)',border:'1px solid #2b4570'}}>
              <div className="flex items-center justify-between gap-2"><span className="tag" style={{background:(SUBJ[cur.s]?.cor||'#888')+'22',color:SUBJ[cur.s]?.cor,border:'1px solid '+(SUBJ[cur.s]?.cor||'#888')+'66'}}>{SUBJ[cur.s]?.curto}</span><span className="label">Pergunta</span></div>

function Quiz({best,onEnd}){

function Match({best,onEnd}){
  const [setIdx,setSetIdx]=useState(()=>ri(0,MATCH.length-1));

  const [R,setR]=useState(()=>mkRound(setIdx));const [selT,setSelT]=useState(null);const [done,setDone]=useState({});const [wrong,setWrong]=useState(0);const [bad,setBad]=useState(null);const [t0,setT0]=useState(Date.now());const [now,setNow]=useState(Date.now());const [fin,setFin]=useState(null);
  const newRound=()=>{const n=(setIdx+1+ri(0,MATCH.length-2))%MATCH.length;setSetIdx(n);setR(mkRound(n));setSelT(null);setDone({});setWrong(0);setBad(null);setT0(Date.now());setNow(Date.now());setFin(null);};

    <div className="grid sm:grid-cols-2 gap-3">
      <div className="grid gap-2 content-start">{R.terms.map(x=>{const dn=done[x.id],sel=selT===x.id;return <button key={x.id} disabled={dn} onClick={()=>setSelT(sel?null:x.id)} className="btn !justify-start text-left !py-3 font-display" style={{background:dn?hues[x.id%5]+'22':sel?'rgba(242,193,78,.16)':undefined,borderColor:dn?hues[x.id%5]:sel?'var(--gold)':undefined,color:dn?hues[x.id%5]:sel?'var(--gold)':undefined}}>{dn&&<Ic n="Check" size={15} strokeWidth={3}/>}<span className="min-w-0 break-words">{x.t}</span></button>;})}</div>
      <div className="grid gap-2 content-start">{R.defs.map(x=>{const dn=done[x.id];return <button key={x.id} disabled={dn} onClick={()=>clickDef(x)} className={'btn !justify-start text-left !py-3 '+(bad===x.id?'shake':'')} style={{background:dn?hues[x.id%5]+'22':undefined,borderColor:bad===x.id?'var(--bad)':dn?hues[x.id%5]:undefined,color:dn?hues[x.id%5]:undefined,fontWeight:500}}><span className="min-w-0 break-words">{x.d}</span></button>;})}</div>
    </div>
  </div>;
}
function Hint({h}){

  if(h.kind==='pct'){const n=20,f=Math.round(h.p/5);return <div style={box}><div className="text-xs mb-2" style={{color:'var(--muted)'}}>Imagine o total ({h.total}) em 20 caixas de 5% cada. Pinte {h.p}%:</div><div className="grid grid-cols-10 gap-1">{Array.from({length:n},(_,i)=><div key={i} className="rounded" style={{height:22,background:i<f?'var(--gold)':'#14253d',border:'1px solid var(--line)'}}/>)}</div><div className="text-xs mt-2 font-mono" style={{color:'var(--gold)'}}>cada caixa = 5% = {fmt(h.total/20)} · {f} caixas</div></div>;}

function MathGame({best,onEnd}){

      SFX.done();const td=todayISO(),bk=pomo.blockKey;
      setS(s=>({...s,studied:{...s.studied,[td]:true},minutes:{...s.minutes,[td]:(s.minutes[td]||0)+40},xp:(s.xp||0)+15,mission:bk?{...s.mission,[bk]:true}:s.mission}));
      toast('Foco concluído! +15 XP. Hora da pausa de 10 min.','ok');
      setPomo(p=>({...p,mode:'break',left:BREAK,endAt:Date.now()+BREAK*1000,cycles:p.cycles+1}));
    }else{SFX.done();toast('Pausa encerrada. Pronto para o próximo foco?','gold');setPomo(p=>({...p,mode:'focus',left:FOCUS,running:false}));}
  },[pomo.left,pomo.running]);
  const openPomo=(b)=>{
    const label=b?`${SUBJ[b.subject]?.curto}: ${b.foco}`:'Sessão livre';
    setPomo(p=>(p.running&&p.label===label)?{...p,open:true}:{...p,open:true,mode:'focus',running:false,left:FOCUS,label,blockKey:b?today+':'+b.id:null});
  };
  const wd=new Date().getDay(),tb=(S.schedule[wd]||[]).slice().sort((a,b)=>a.start.localeCompare(b.start));
  const showBanner=S.bannerOff!==today&&tb.length>0&&!S.studied[today];
  const rk=RANKS[D.rankIdx];const streak=calcStreak(S.studied);
  return <div className="max-w-6xl mx-auto" style={{paddingBottom:'96px'}}>
    <header className="sticky z-40 -mx-4 px-4 py-2.5 md:py-3" style={{top:'env(safe-area-inset-top,0px)',background:'rgba(7,14,27,.97)',borderBottom:'1px solid var(--line)'}}>
      <div className="flex items-center gap-3 flex-wrap md:flex-nowrap">
        <div className="flex items-center gap-2.5 min-w-0 mr-auto">
          <div className="grid place-items-center rounded-lg flex-none" style={{width:34,height:34,background:'rgba(242,193,78,.14)',border:'1px solid rgba(242,193,78,.5)',color:'var(--gold)'}}><Ic n="Shield" size={20}/></div>
          <div className="min-w-0"><div className="font-display font-bold leading-tight tracking-wide truncate">OPERAÇÃO PMBA</div><div className="label !text-[9px] truncate">Painel tático de estudos</div></div>
        </div>
        <nav className="nav-bottom md:order-none"><div className="flex justify-between md:gap-1 max-w-6xl mx-auto">{TABS.map(t=><button key={t.id} onClick={()=>goTab(t.id)} aria-current={S.tab===t.id?'page':undefined} className="flex flex-col md:flex-row items-center gap-0.5 md:gap-2 flex-1 md:flex-none py-2 md:px-3 md:py-2 rounded-lg" style={{background:'none',border:0,cursor:'pointer',color:S.tab===t.id?'var(--gold)':'var(--muted)',fontSize:11,fontWeight:600,...(S.tab===t.id?{background:'rgba(242,193,78,.1)'}:{})}}><Ic n={t.ic} size={20}/><span className="md:text-sm">{t.nome}</span></button>)}</div></nav>
        <div className="flex items-center gap-1.5">
          <span className="chip hidden sm:inline-flex" style={{color:'var(--gold)',cursor:'default'}}><Ic n={rk.ic} size={13}/>{rk.n}</span>
          <span className="chip" style={{color:streak?'#fb923c':undefined,cursor:'default'}}><Ic n="Flame" size={13}/>{streak}</span>
          {pomo.running&&<button className="chip on font-mono" onClick={()=>setPomo(p=>({...p,open:true}))}><Ic n="Timer" size={13}/>{ft(pomo.left)}</button>}
          <button className="btn btn-sm btn-ghost !px-2" onClick={()=>setS(s=>({...s,sound:!s.sound}))} aria-label={S.sound?'Desligar som':'Ligar som'}><Ic n={S.sound?'Volume2':'VolumeX'} size={16}/></button>
          <button className="btn btn-sm !px-2.5" onClick={()=>setModal('backup')}><Ic n="Save" size={15}/><span className="hidden lg:inline">Backup</span></button>
        </div>
      </div>
    </header>
    {showBanner&&<div className="mt-4 rounded-xl p-3 flex items-center gap-3 flex-wrap rise" style={{background:'rgba(242,193,78,.1)',border:'1px solid rgba(242,193,78,.45)'}}>
      <Ic n="Bell" size={20} style={{color:'var(--gold)'}} className="flex-none"/>
      <div className="min-w-0 flex-1 basis-60 text-sm"><b style={{color:'var(--gold)'}}>Lembrete:</b> hoje você estuda {tb.map(b=>SUBJ[b.subject]?.curto).join(' → ')}, a partir das <b className="font-mono">{tb[0].start}</b>.</div>
      <button className="btn btn-sm btn-gold" onClick={()=>openPomo(tb[0])}><Ic n="Play" size={13}/>Começar</button>
      <button className="btn btn-sm" onClick={()=>setModal('ics')}><Ic n="CalendarPlus" size={13}/>Agenda</button>
      <button className="btn btn-sm btn-ghost !px-2" onClick={()=>setS(s=>({...s,bannerOff:today}))} aria-label="Dispensar lembrete"><Ic n="X" size={14}/></button>
    </div>}
    {!store&&<div className="mt-4 rounded-xl p-3 text-sm" style={{background:'rgba(240,97,109,.1)',border:'1px solid rgba(240,97,109,.4)'}}>Este navegador está bloqueando o salvamento automático. Use o botão Backup para guardar seu progresso.</div>}
    <main className="mt-4" key={S.tab}><div className="rise">
      {S.tab==='home'&&<Home S={S} setS={setS} D={D} today={today} openPomo={openPomo} openIcs={()=>setModal('ics')} goTab={goTab}/>}
      {S.tab==='plan'&&<Plan S={S} setS={setS} today={today} openPomo={openPomo}/>}
      {S.tab==='edital'&&<Edital S={S} setS={setS}/>}
      {S.tab==='cards'&&<Cards S={S} setS={setS} addXp={addXp}/>}
      {S.tab==='arena'&&<Arena S={S} setS={setS} addXp={addXp} bestSet={bestSet}/>}
    </div></main>
    {modal==='ics'&&<IcsModal S={S} setS={setS} onClose={()=>setModal(null)} toast={toast}/>}
    {modal==='backup'&&<BackupModal S={S} setS={setS} onClose={()=>setModal(null)} toast={toast}/>}
    {pomo.open&&<PomoModal pomo={pomo} setPomo={setPomo} onClose={()=>setPomo(p=>({...p,open:false}))}/>}
    <div className="fixed left-0 right-0 z-[90] flex flex-col items-center gap-2 pointer-events-none" style={{bottom:'calc(88px + env(safe-area-inset-bottom,0px))'}}>{toasts.map(t=><div key={t.id} className="rise rounded-xl px-4 py-2.5 text-sm font-semibold max-w-[92vw]" style={{background:t.k==='gold'?'var(--gold)':t.k==='ok'?'var(--ok)':'var(--lead)',color:t.k?'#14100a':'var(--fg)',boxShadow:'0 8px 30px rgba(0,0,0,.5)'}}>{t.m}</div>)}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
